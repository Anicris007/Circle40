# Runs on every pull request into main (and on main after a merge).
# The two jobs, "App checks" and "Database schema", show as checks on each PR.
# Require them in a branch rule on main and a PR can't merge until they pass.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Expo SDK 58 supports Node ^22.13 or ^24.3.
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Bundle for Android
        # Catches import and bundling errors that typecheck and tests miss.
        run: npx expo export --platform android --output-dir ../ci-export

  database:
    name: Database schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Parse migrations with the Postgres SQL parser
        run: |
          mkdir -p "$RUNNER_TEMP/sqlcheck"
          npm install --prefix "$RUNNER_TEMP/sqlcheck" --no-save --no-audit --no-fund libpg-query@18.2.4
          node .github/scripts/check-sql.mjs "$RUNNER_TEMP/sqlcheck" supabase/migrations
